[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "demo_clips", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # FastAPI Depends() in defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402"]
"**/conftest.py" = ["E402"]
"alembic/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["services", "libs"]
