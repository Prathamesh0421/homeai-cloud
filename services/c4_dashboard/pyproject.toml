[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c4-dashboard"
version = "0.1.0"
description = "HomeAI Cloud C4 — System Dashboard, auth, RBAC, settings, dashboards, app shell."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "PyJWT[crypto]>=2.8",
  "bcrypt>=4.1",
  "email-validator>=2.1",
  "boto3>=1.34",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
