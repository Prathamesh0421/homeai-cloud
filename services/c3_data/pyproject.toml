[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c3-data"
version = "0.1.0"
description = "HomeAI Cloud C3 — System Database Management and AI inference: YAMNet pipeline, model registry, records, integrity."
requires-python = ">=3.11"
# homeai-common (libs/homeai_common) is installed first by the Dockerfile / CI / dev setup.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pymongo>=4.6",
  "boto3>=1.34",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "python-json-logger>=2.0",
  "python-multipart>=0.0.9",
  "APScheduler>=3.10,<4",
  "tensorflow-cpu>=2.15,<3",
  "tensorflow-hub>=0.16",
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: pure logic, no external stores (default)",
  "integration: needs real Postgres / Mongo / LocalStack (required on CI, skipped locally)",
  "slow: real YAMNet inference on demo clips (run before demos)",
]
